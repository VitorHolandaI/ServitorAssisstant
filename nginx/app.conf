# Shared by the plain and the TLS server blocks. Outside conf.d on purpose:
# nginx loads everything in conf.d by itself, and this is an include, not a
# server of its own.

# The frontend, built into static files at image build time.
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# The API. The trailing slash on proxy_pass strips the /api prefix, so the
# browser and the app agree on one origin and mixed content cannot happen.
location /api/ {
    proxy_pass http://backend:8000/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE / streaming: the agent answers token by token.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    chunked_transfer_encoding on;
}
