# Plain HTTP. Keep it only while the proxy manager still forwards http, or for
# a machine where both ends sit on the same host.
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/app.conf;
}

# The hop from the proxy manager. 10.66.66.x is wireguard, but these machines
# are on the home LAN as well and nothing forces the traffic through the
# tunnel -- over wifi it would otherwise be in the clear.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/servitor/app.home.pem;
    ssl_certificate_key /etc/servitor/app.home-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Only the proxy manager gets to talk to the stack. Uncomment once NPM
    # sends a client certificate (proxy_ssl_certificate in its Advanced tab);
    # until then it would lock everyone out, including you.
    # ssl_client_certificate /etc/servitor/home-root-ca.crt;
    # ssl_verify_client on;

    include /etc/nginx/snippets/app.conf;
}
